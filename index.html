<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>货车贪吃蛇 · Truck Snake</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%}
body{margin:0;background:radial-gradient(1100px 700px at 50% -12%,#1a2130 0%,#0a0d13 55%,#06080d 100%);color:#e9eef7;font-family:"Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;padding:12px;gap:10px;overflow:hidden}
.wrap{width:min(100%,1000px,calc((100dvh - 156px) * 1.6));display:flex;flex-direction:column;gap:10px}
.bar{display:flex;align-items:center;gap:12px;padding:7px 12px;border-radius:14px;background:linear-gradient(180deg,rgba(28,34,45,.92),rgba(16,20,27,.92));border:1px solid rgba(255,255,255,.08);box-shadow:0 10px 26px rgba(0,0,0,.45);flex-wrap:wrap}
.stat{display:flex;align-items:baseline;gap:5px;font-size:11px;color:#8b95a7;letter-spacing:.08em}
.stat b{font-size:17px;color:#e9eef7;font-variant-numeric:tabular-nums;font-weight:800}
.stat.amber b{color:#ffb020}
.spacer{flex:1}
.meter{display:flex;align-items:center;gap:6px;font-size:11px;color:#8b95a7;letter-spacing:.06em}
.meter i{display:block;width:78px;height:8px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
.meter em{display:block;height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,#63d3ff,#3b7ff0)}
.meter.nitro em{background:linear-gradient(90deg,#7ef0c8,#ffd166)}
.meter.nitro.full em{box-shadow:0 0 10px rgba(255,209,102,.9)}
.meter.combo em{background:linear-gradient(90deg,#ffd166,#ff7a3d)}
.meter.combo.on{color:#ffd166;font-weight:800}
.meter.combo.on i{background:rgba(255,209,102,.18)}
.iconbtn{width:32px;height:32px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#cfd7e4;font-size:14px;line-height:1;cursor:pointer;display:grid;place-items:center;transition:.15s;flex:0 0 auto}
.iconbtn:hover{background:rgba(255,255,255,.13);color:#fff}
.iconbtn:active{transform:scale(.93)}
.stage{position:relative;width:100%;aspect-ratio:960/600;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.1);box-shadow:0 26px 60px rgba(0,0,0,.55);background:#151a22}
canvas{display:block;width:100%;height:100%;touch-action:none}
.veil{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(8,11,16,.7);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:5}
.veil.show{display:flex}
.card{width:min(580px,100%);text-align:center;padding:22px;border-radius:18px;background:linear-gradient(180deg,rgba(33,40,54,.97),rgba(17,21,29,.97));border:1px solid rgba(255,255,255,.1);box-shadow:0 22px 50px rgba(0,0,0,.6);animation:pop .26s cubic-bezier(.2,1.2,.4,1)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.badge{display:inline-block;font-size:11px;letter-spacing:.2em;color:#ffb020;background:rgba(255,176,32,.12);border:1px solid rgba(255,176,32,.32);padding:4px 10px;border-radius:999px;margin-bottom:10px}
h1{margin:0 0 8px;font-size:29px;letter-spacing:.02em;background:linear-gradient(180deg,#fff,#b3bfd2);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:0 0 12px;font-size:13px;line-height:1.7;color:#9aa5b8}
.legend{display:flex;flex-wrap:wrap;gap:7px;align-items:center;justify-content:center;font-size:12.5px;color:#c6d0de;margin-bottom:10px}
.lg{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);padding:5px 10px;border-radius:9px}
.lg b{color:#ffb020}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block}
.dot.red{background:#ff5a52}.dot.blue{background:#4b8ef0}
.arrow{color:#5d6879}
.keys{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:14px;font-size:12px;color:#93a0b3}
.key{padding:4px 9px;border-radius:7px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);font-weight:700;color:#dbe3ee}
.btn{font:inherit;font-weight:800;letter-spacing:.04em;border:0;cursor:pointer;padding:13px 26px;border-radius:12px;font-size:15px;transition:.15s}
.btn.primary{color:#241703;background:linear-gradient(180deg,#ffcb52,#ffa41b);box-shadow:0 10px 24px rgba(255,164,27,.3)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.primary:active{transform:translateY(1px)}
.btn.ghost{color:#cfd7e4;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14)}
.hint{margin-top:11px;font-size:12px;color:#77839a}
.ostats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px;margin:4px 0 16px}
.ostat{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px 8px}
.ostat span{display:block;font-size:11px;color:#8b95a7;letter-spacing:.1em;margin-bottom:4px}
.ostat b{font-size:20px;font-variant-numeric:tabular-nums}
.ostat.amber b{color:#ffb020}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.dpad{display:none;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px);gap:6px;justify-content:center;margin-top:2px}
body.touch .dpad{display:grid}
.dbtn{border-radius:14px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.07);color:#cfd7e4;font-size:17px;display:grid;place-items:center;cursor:pointer}
.dbtn:active,.dbtn.on{background:rgba(255,176,32,.22);border-color:rgba(255,176,32,.5)}
.dbtn.boost{font-size:12px;font-weight:800;letter-spacing:.06em;color:#0f1a12;background:linear-gradient(180deg,#8ef0c8,#41c79a);border-color:rgba(140,240,200,.5)}
.dbtn.boost.on{background:linear-gradient(180deg,#c8ffe9,#63e0b4)}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="stat">得分<b id="hudScore">0</b></div>
    <div class="stat">车厢<b id="hudCars">0</b></div>
    <div class="stat amber">最佳<b id="hudBest">0</b></div>
    <div class="spacer"></div>
    <div class="meter combo" id="comboWrap"><span id="comboTxt">连击</span><i><em id="comboBar"></em></i></div>
    <div class="meter nitro" id="nitroWrap"><span>氮气</span><i><em id="nitroBar"></em></i></div>
    <div class="spacer"></div>
    <button class="iconbtn" id="btnSound" title="音效开关">🔊</button>
    <button class="iconbtn" id="btnPause" title="暂停 / 继续">⏸</button>
    <button class="iconbtn" id="btnRestart" title="重新开始">↻</button>
  </div>
  <div class="stage">
    <canvas id="game" width="960" height="600"></canvas>
    <div class="veil" id="veil"></div>
  </div>
  <div class="dpad" id="dpad">
    <button class="dbtn" data-dir="up" style="grid-area:1/2">▲</button>
    <button class="dbtn" data-dir="left" style="grid-area:2/1">◀</button>
    <button class="dbtn" data-dir="right" style="grid-area:2/3">▶</button>
    <button class="dbtn" data-dir="down" style="grid-area:3/2">▼</button>
    <button class="dbtn boost" id="btnBoost" style="grid-area:3/3">冲刺</button>
  </div>
</div>
<script>
(function(){
'use strict';

const $ = s => document.querySelector(s);
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const rnd = (a,b) => a + Math.random()*(b-a);
const pick = a => a[(Math.random()*a.length)|0];
const TAU = Math.PI*2;
const angDiff = (a,b) => { let d=(a-b+Math.PI)%TAU; if(d<0) d+=TAU; return d-Math.PI; };
const rotToward = (c,t,step) => { const d=angDiff(t,c); return Math.abs(d)<=step ? t : c+Math.sign(d)*step; };
function rr(g,x,y,w,h,r){
  r = Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  g.beginPath(); g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
}

const cv = $('#game');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const WALL = 18;
const AR = { x:WALL, y:WALL, w:W-WALL*2, h:H-WALL*2 };

const SPACING = 44;
const TURN = 5.2;
const BASE_SPEED = 170;
const SPEED_STEP = 2.0;
const SPEED_MAX = 280;
const MAX_SEG = 26;
const COMBO_TIME = 2.6;
const COMBO_MAX = 8;
const BOOST_MUL = 1.72;
const BOOST_TURN = 0.82;
const BOOST_DRAIN = 0.33;
const MARK_LIFE = 2.4;
const TRAILER_DEATH = false;
const PAL = ['#e2574c','#4b8ef0','#3fb27f','#e0a33e','#a86ede','#38bdc4','#ef7ba0','#7cc157'];
const Sound = {
  on:true, ac:null, master:null,
  init(){
    if(this.ac) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    this.ac = new AC();
    this.master = this.ac.createGain();
    this.master.gain.value = 0.42;
    this.master.connect(this.ac.destination);
  },
  resume(){ if(this.ac && this.ac.state === 'suspended') this.ac.resume(); },
  blip(freq,dur,opt){
    opt = opt || {};
    if(!this.on || !this.ac) return;
    const t0 = this.ac.currentTime + (opt.delay||0);
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = opt.type || 'square';
    o.frequency.setValueAtTime(freq,t0);
    if(opt.slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+opt.slide), t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.linearRampToValueAtTime(opt.vol||0.07, t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0+dur+0.03);
  },
  noise(dur,vol,from,to){
    if(!this.on || !this.ac) return;
    const t0 = this.ac.currentTime;
    const len = Math.floor(this.ac.sampleRate*dur);
    const buf = this.ac.createBuffer(1,len,this.ac.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/len,2);
    const s = this.ac.createBufferSource(); s.buffer = buf;
    const f = this.ac.createBiquadFilter(); f.type = 'lowpass';
    f.frequency.setValueAtTime(from||1500,t0);
    f.frequency.exponentialRampToValueAtTime(to||180,t0+dur);
    const g = this.ac.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t0);
  },
  hit(combo){
    const f = 520 + Math.min(combo,10)*62;
    this.blip(f,0.07,{type:'square',vol:0.05});
    this.blip(f*1.5,0.11,{type:'square',vol:0.045,delay:0.05});
  },
  crunch(){
    this.noise(0.16,0.20,2400,300);
    this.blip(150,0.09,{type:'triangle',vol:0.05});
  },
  gold(){ [523,659,784,1046,1318].forEach((f,i)=>this.blip(f,0.13,{type:'triangle',vol:0.08,delay:i*0.06})); },
  boostOn(){ this.blip(180,0.42,{type:'sawtooth',vol:0.09,slide:520}); this.noise(0.3,0.1,900,2400); },
  boostTick(){ this.noise(0.14,0.05,500,1800); },
  boostOff(){ this.blip(420,0.22,{type:'sawtooth',vol:0.06,slide:-260}); },
  crash(){ this.noise(0.6,0.34,1800,120); this.blip(170,0.5,{type:'sawtooth',vol:0.13,slide:-120}); },
  go(){ this.blip(440,0.13,{type:'square',vol:0.06}); this.blip(680,0.16,{type:'square',vol:0.06,delay:0.12}); }
};
const S = {
  mode:'menu', t:0, score:0, best:0, trailers:0,
  head:{x:0,y:0,angle:0}, targetAngle:0, speed:BASE_SPEED,
  trail:[], body:[], bikes:[], parts:[], texts:[], rings:[], marks:[], flashes:[],
  shake:0, hitStop:0, flash:0, flashColor:'#ffffff',
  combo:0, comboT:0, comboMax:0, nitro:0.45, boosting:false, boostTick:0,
  kills:0, spawnTimer:0, menuAngle:0, overT:0, reason:'', markT:0, smokeT:0,
  wheelL:{x:0,y:0}, wheelR:{x:0,y:0}, wheelsReady:false
};
try { S.best = parseInt(localStorage.getItem('truck-snake-best')||'0',10) || 0; } catch(e){ S.best = 0; }

function speedFor(n){ return Math.min(SPEED_MAX, BASE_SPEED + n*SPEED_STEP); }
function curSpeed(){ return speedFor(S.trailers) * (S.boosting ? BOOST_MUL : 1); }
function bikeTarget(){ return Math.min(8, 4 + Math.floor(S.trailers/5)); }

function placeHead(x,y,angle,segs){
  S.head = {x:x,y:y,angle:angle};
  S.targetAngle = angle;
  S.trailers = segs;
  S.speed = speedFor(segs);
  S.trail.length = 0;
  const need = segs*SPACING + 380;
  for(let d=need; d>=0; d-=8) S.trail.push({ x:x-Math.cos(angle)*d, y:y-Math.sin(angle)*d });
  S.body = computeBody();
  S.wheelsReady = false;
}

function resetGame(){
  S.score = 0; S.parts.length = 0; S.texts.length = 0;
  S.rings.length = 0; S.marks.length = 0; S.flashes.length = 0;
  S.shake = 0; S.hitStop = 0; S.flash = 0; S.spawnTimer = 0.2; S.reason = '';
  S.combo = 0; S.comboT = 0; S.comboMax = 0; S.nitro = 0.45;
  S.boosting = false; S.boostTick = 0; S.kills = 0; S.overT = 0;
  S.bikes.length = 0;
  placeHead(AR.x + AR.w*0.5 - 190, AR.y + AR.h*0.5, 0, 1);
  for(let i=0;i<4;i++) spawnBike(true);
  S.mode = 'play';
  syncHUD();
}

function setupMenu(){
  S.score = 0; S.parts.length = 0; S.texts.length = 0;
  S.rings.length = 0; S.marks.length = 0; S.flashes.length = 0;
  S.shake = 0; S.hitStop = 0; S.flash = 0; S.spawnTimer = 0.6;
  S.combo = 0; S.comboT = 0; S.comboMax = 0; S.nitro = 1; S.boosting = false; S.kills = 0;
  S.bikes.length = 0;
  S.menuAngle = 0.2;
  placeHead(AR.x + AR.w*0.5 + 170, AR.y + AR.h*0.5 - 130, 0.5, 7);
  for(let i=0;i<6;i++) spawnBike(false);
  S.mode = 'menu';
  syncHUD();
}

function kindCfg(kind){
  const k = 1 + S.trailers*0.008;
  if(kind === 'racer') return { speed:rnd(112,134)*k, turn:4.3, color:'#ff5a52', helmet:'#ffe9a8', base:20, add:1 };
  if(kind === 'gold') return { speed:rnd(72,92)*k, turn:3.5, color:'#ffc93c', helmet:'#2b2f3a', base:30, add:2 };
  return { speed:rnd(52,78)*k, turn:2.9, color:pick(['#4b8ef0','#3fb27f','#a86ede','#38bdc4','#e0a33e']), helmet:'#e9eef7', base:10, add:1 };
}

function makeBike(x,y,ang,kind){
  const cfg = kindCfg(kind);
  S.bikes.push({ x:x, y:y, angle:ang, want:ang, wander:ang, wt:rnd(0,1.6), kind:kind,
                 speed:cfg.speed, turn:cfg.turn, color:cfg.color, helmet:cfg.helmet,
                 base:cfg.base, add:cfg.add, wob:rnd(0,TAU) });
}

function freeSpot(initial){
  const minD = initial ? 250 : 190;
  for(let a=0;a<80;a++){
    const x = rnd(AR.x+46, AR.x+AR.w-46);
    const y = rnd(AR.y+46, AR.y+AR.h-46);
    if(Math.hypot(x-S.head.x, y-S.head.y) < minD) continue;
    if(hitTruck(x,y) >= 0) continue;
    let bad = false;
    for(const b of S.bikes) if(Math.hypot(x-b.x,y-b.y) < 74){ bad = true; break; }
    if(!bad) return { x:x, y:y };
  }
  return null;
}

function spawnBike(initial){
  const spot = freeSpot(initial);
  if(!spot) return;
  const kind = Math.random() < 0.10 ? 'gold' : (Math.random() < 0.44 ? 'racer' : 'cruiser');
  const ang = rnd(0,TAU);
  makeBike(spot.x, spot.y, ang, kind);
  if(kind !== 'gold' && S.bikes.length + 2 <= bikeTarget() && Math.random() < 0.3){
    const a2 = ang + 1.7;
    for(let i=1;i<=2;i++){
      const ox = spot.x + Math.cos(a2)*48*i, oy = spot.y + Math.sin(a2)*48*i;
      if(ox < AR.x+30 || ox > AR.x+AR.w-30 || oy < AR.y+30 || oy > AR.y+AR.h-30) break;
      if(hitTruck(ox,oy) >= 0) break;
      makeBike(ox, oy, ang, 'cruiser');
    }
  }
}

function updateBikes(dt){
  const fleeK = Math.min(4.2, 1.9 + S.trailers*0.07);
  for(const b of S.bikes){
    b.wob += dt*7;
    b.wt -= dt;
    if(b.wt <= 0){ b.wt = rnd(0.7,1.9); b.wander += rnd(-1.25,1.25); }
    let vx = Math.cos(b.wander), vy = Math.sin(b.wander);
    const m = 120;
    if(b.x-AR.x < m) vx += (m-(b.x-AR.x))/m * 2.3;
    if(AR.x+AR.w-b.x < m) vx -= (m-(AR.x+AR.w-b.x))/m * 2.3;
    if(b.y-AR.y < m) vy += (m-(b.y-AR.y))/m * 2.3;
    if(AR.y+AR.h-b.y < m) vy -= (m-(AR.y+AR.h-b.y))/m * 2.3;
    if(b.kind !== 'cruiser' && S.mode !== 'over'){
      const dx = b.x-S.head.x, dy = b.y-S.head.y, d = Math.hypot(dx,dy) || 1;
      if(d < 330){ const k = (1-d/330)*fleeK; vx += dx/d*k; vy += dy/d*k; }
    }
    b.angle = rotToward(b.angle, Math.atan2(vy,vx), b.turn*dt);
    b.x += Math.cos(b.angle)*b.speed*dt;
    b.y += Math.sin(b.angle)*b.speed*dt;
    b.x = clamp(b.x, AR.x+14, AR.x+AR.w-14);
    b.y = clamp(b.y, AR.y+14, AR.y+AR.h-14);
  }
  if(S.mode === 'play' || S.mode === 'menu'){
    if(S.bikes.length < bikeTarget()){
      S.spawnTimer -= dt;
      if(S.spawnTimer <= 0){
        spawnBike(false);
        S.spawnTimer = S.bikes.length === 0 ? 0.15 : rnd(0.45,1.2);
      }
    } else S.spawnTimer = 0.4;
  }
}
function computeBody(){
  const out = [];
  const n = S.trailers;
  if(n <= 0) return out;
  let target = SPACING, acc = 0;
  let prev = S.head;
  const tr = S.trail;
  for(let i=tr.length-1;i>=0;i--){
    const p = tr[i];
    const dx = p.x-prev.x, dy = p.y-prev.y;
    const d = Math.hypot(dx,dy);
    if(d > 1e-6){
      while(acc + d >= target && out.length < n){
        const t = (target-acc)/d;
        out.push({ x:prev.x+dx*t, y:prev.y+dy*t, a:Math.atan2(-dy,-dx) });
        target += SPACING;
      }
    }
    acc += d;
    prev = p;
    if(out.length >= n) break;
  }
  while(out.length < n){
    const last = out.length ? out[out.length-1] : { x:S.head.x, y:S.head.y, a:S.head.angle };
    out.push({ x:last.x-Math.cos(last.a)*SPACING, y:last.y-Math.sin(last.a)*SPACING, a:last.a });
  }
  return out;
}

function pushTrail(){
  const tr = S.trail, h = S.head, last = tr[tr.length-1];
  if(!last || Math.hypot(h.x-last.x, h.y-last.y) >= 4) tr.push({ x:h.x, y:h.y });
  const need = S.trailers*SPACING + 420;
  let acc = 0, i = tr.length-1;
  while(i > 0 && acc < need){ acc += Math.hypot(tr[i].x-tr[i-1].x, tr[i].y-tr[i-1].y); i--; }
  if(i > 0) tr.splice(0,i);
}

function boxHit(px,py,cx,cy,a,hw,hh,r){
  const dx = px-cx, dy = py-cy;
  const ca = Math.cos(a), sa = Math.sin(a);
  const lx = dx*ca + dy*sa;
  const ly = -dx*sa + dy*ca;
  const ox = Math.max(Math.abs(lx)-hw, 0), oy = Math.max(Math.abs(ly)-hh, 0);
  return ox*ox + oy*oy < r*r;
}

function hitTruck(px,py){
  if(boxHit(px,py,S.head.x,S.head.y,S.head.angle,25,14,11)) return 0;
  const b = S.body;
  for(let i=0;i<b.length;i++){
    const s = b[i];
    const dx = px-s.x, dy = py-s.y;
    if(dx*dx + dy*dy > 1521) continue;
    if(boxHit(px,py,s.x,s.y,s.a,21,13,11)) return i+1;
  }
  return -1;
}

function stepHead(dt){
  const dir = inputVector();
  if(dir){
    const a = Math.atan2(dir.y, dir.x);
    if(S.trailers === 0 || Math.abs(angDiff(a, S.head.angle)) < 1.9) S.targetAngle = a;
  }
  const turn = TURN * (S.boosting ? BOOST_TURN : 1);
  S.head.angle = rotToward(S.head.angle, S.targetAngle, turn*dt);
  S.speed = curSpeed();
  S.head.x += Math.cos(S.head.angle)*S.speed*dt;
  S.head.y += Math.sin(S.head.angle)*S.speed*dt;
  pushTrail();
  sampleMarks(dt);
  sampleSmoke(dt);
  const h = S.head, pad = 20;
  if(h.x < AR.x+pad || h.x > AR.x+AR.w-pad || h.y < AR.y+pad || h.y > AR.y+AR.h-pad) crash('wall');
}

function stepMenu(dt){
  S.menuAngle += 0.82*dt;
  S.targetAngle = S.menuAngle;
  S.head.angle = rotToward(S.head.angle, S.targetAngle, TURN*dt);
  S.speed = speedFor(S.trailers);
  S.head.x += Math.cos(S.head.angle)*S.speed*dt;
  S.head.y += Math.sin(S.head.angle)*S.speed*dt;
  S.head.x = clamp(S.head.x, AR.x+70, AR.x+AR.w-70);
  S.head.y = clamp(S.head.y, AR.y+70, AR.y+AR.h-70);
  pushTrail();
  sampleMarks(dt);
  S.body = computeBody();
}

function sampleMarks(dt){
  const h = S.head;
  const ca = Math.cos(h.angle), sa = Math.sin(h.angle);
  const lx = -19, ly = 14.5;
  const wl = { x:h.x + lx*ca - ly*sa, y:h.y + lx*sa + ly*ca };
  const wr = { x:h.x + lx*ca + ly*sa, y:h.y + lx*sa - ly*ca };
  S.markT -= dt;
  const hard = S.boosting || Math.abs(angDiff(h.angle, S.targetAngle)) > 0.45;
  if(S.wheelsReady && hard && S.markT <= 0){
    S.markT = 0.05;
    S.marks.push({ x1:S.wheelL.x, y1:S.wheelL.y, x2:wl.x, y2:wl.y, life:MARK_LIFE, max:MARK_LIFE });
    S.marks.push({ x1:S.wheelR.x, y1:S.wheelR.y, x2:wr.x, y2:wr.y, life:MARK_LIFE, max:MARK_LIFE });
    if(S.marks.length > 260) S.marks.splice(0,2);
  }
  S.wheelL = wl; S.wheelR = wr;
  S.wheelsReady = true;
}

function sampleSmoke(dt){
  S.smokeT -= dt;
  const fast = S.speed > 212 || S.boosting;
  if(!fast || S.smokeT > 0) return;
  S.smokeT = S.boosting ? 0.03 : 0.09;
  const h = S.head, ca = Math.cos(h.angle), sa = Math.sin(h.angle);
  S.parts.push({ kind:'smoke', x:h.x-26*ca-8*sa, y:h.y-26*sa+8*ca,
    vx:rnd(-16,16)-Math.cos(h.angle)*26, vy:rnd(-16,16)-Math.sin(h.angle)*26,
    life:0.7, max:0.7, size:rnd(4,7), color:'#8d97a6', rot:0, vr:rnd(-2,2) });
}

function collide(){
  for(let i=S.bikes.length-1;i>=0;i--){
    const hit = hitTruck(S.bikes[i].x, S.bikes[i].y);
    if(hit === 0) eatBike(i, 0);
    else if(hit > 0){
      if(TRAILER_DEATH) crash('bike'); else eatBike(i, hit);
    }
    if(S.mode !== 'play') return;
  }
  const h = S.head;
  for(let i=1;i<S.body.length;i++){
    const s = S.body[i];
    if(Math.hypot(h.x-s.x, h.y-s.y) < 24){ crash('self'); return; }
  }
}

function eatBike(i, hit){
  const b = S.bikes[i];
  S.bikes.splice(i,1);
  const gold = b.kind === 'gold';
  S.trailers = Math.min(MAX_SEG, S.trailers + b.add);
  S.combo = Math.min(99, S.combo + 1);
  S.comboT = COMBO_TIME;
  if(S.combo > S.comboMax) S.comboMax = S.combo;
  const mult = Math.min(COMBO_MAX, S.combo);
  const pts = b.base * mult;
  S.score += pts;
  S.kills++;
  S.nitro = Math.min(1, S.nitro + 0.135);
  burst(b.x, b.y, b.color, gold ? 28 : 15);
  burst(b.x, b.y, '#ffd166', gold ? 12 : 6);
  flingRider(b.x, b.y, b.helmet, b.color);
  addRing(b.x, b.y, gold ? '255,209,102' : '255,255,255', gold ? 78 : 44);
  if(hit > 0){
    const t = S.body[hit-1];
    if(t) S.flashes.push({ x:t.x, y:t.y, a:t.a, life:0.28, max:0.28 });
    Sound.crunch();
    Sound.hit(S.combo);
  } else {
    Sound.hit(S.combo);
  }
  if(gold){
    Sound.gold();
    S.flash = 0.34;
    S.flashColor = '#ffd166';
  }
  addText(b.x, b.y - 6, '+' + pts, mult > 1 ? ('连击 x' + mult) : (hit > 0 ? '车厢扫中' : '撞毁'), gold ? '#ffd166' : '#ffffff');
  S.shake = Math.min(1.2, S.shake + (gold ? 0.7 : 0.42));
  S.hitStop = gold ? 0.085 : 0.05;
  syncHUD();
}

function crash(reason){
  if(S.mode !== 'play') return;
  S.reason = reason;
  S.mode = 'over';
  S.shake = 1.6;
  S.flash = 0.35;
  S.flashColor = '#ff8a3d';
  S.overT = 1.5;
  burst(S.head.x, S.head.y, '#ff8a3d', 34);
  burst(S.head.x, S.head.y, '#ffe08a', 16);
  addRing(S.head.x, S.head.y, '255,138,61', 150);
  Sound.crash();
  if(S.score > S.best){
    S.best = S.score;
    try { localStorage.setItem('truck-snake-best', String(S.best)); } catch(e){}
  }
  syncHUD();
  setTimeout(function(){ if(S.mode === 'over') showGameOver(); }, 800);
}

function updateEffects(dt){
  const damp = Math.pow(0.16, dt);
  for(let i=S.parts.length-1;i>=0;i--){
    const p = S.parts[i];
    p.life -= dt;
    if(p.life <= 0){ S.parts.splice(i,1); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt;
    if(p.kind === 'smoke'){
      const d2 = Math.pow(0.35, dt);
      p.vx *= d2; p.vy *= d2;
      p.size += dt*24;
    } else {
      p.vx *= damp; p.vy *= damp;
    }
    p.rot += p.vr*dt;
  }
  for(let i=S.rings.length-1;i>=0;i--){ S.rings[i].life -= dt; if(S.rings[i].life <= 0) S.rings.splice(i,1); }
  for(let i=S.marks.length-1;i>=0;i--){ S.marks[i].life -= dt; if(S.marks[i].life <= 0) S.marks.splice(i,1); }
  for(let i=S.flashes.length-1;i>=0;i--){ S.flashes[i].life -= dt; if(S.flashes[i].life <= 0) S.flashes.splice(i,1); }
  for(let i=S.texts.length-1;i>=0;i--){
    const t = S.texts[i];
    t.life -= dt; t.y -= 44*dt;
    if(t.life <= 0) S.texts.splice(i,1);
  }
}
const keys = { up:false, down:false, left:false, right:false };
let touchDir = null, swipe = null, boostKey = false, boostBtn = false, boostPtr = false;
function boostInput(){ return boostKey || boostBtn || boostPtr; }

function inputVector(){
  if(touchDir) return touchDir;
  let x = 0, y = 0;
  if(keys.up) y -= 1;
  if(keys.down) y += 1;
  if(keys.left) x -= 1;
  if(keys.right) x += 1;
  if(x === 0 && y === 0) return null;
  const m = Math.hypot(x,y);
  return { x:x/m, y:y/m };
}

const KEYMAP = {
  ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
  w:'up', a:'left', s:'down', d:'right', W:'up', A:'left', S:'down', D:'right'
};

window.addEventListener('keydown', function(e){
  Sound.init(); Sound.resume();
  const k = KEYMAP[e.key];
  if(k){ keys[k] = true; e.preventDefault(); return; }
  if(e.key === ' ' || e.key === 'Spacebar'){
    e.preventDefault();
    if(S.mode === 'menu' || S.mode === 'over'){ startGame(); return; }
    if(S.mode === 'pause'){ togglePause(); return; }
    boostKey = true;
    return;
  }
  if(e.key === 'Shift'){ boostKey = true; return; }
  if(e.key === 'p' || e.key === 'P' || e.key === 'Escape'){ e.preventDefault(); togglePause(); }
  if(e.key === 'r' || e.key === 'R'){ startGame(); }
}, {passive:false});

window.addEventListener('keyup', function(e){
  const k = KEYMAP[e.key];
  if(k) keys[k] = false;
  if(e.key === ' ' || e.key === 'Spacebar' || e.key === 'Shift') boostKey = false;
});
window.addEventListener('blur', function(){
  for(const k in keys) keys[k] = false;
  touchDir = null; boostKey = false; boostBtn = false; boostPtr = false;
});

cv.addEventListener('pointerdown', function(e){
  Sound.init(); Sound.resume();
  swipe = { id:e.pointerId, x:e.clientX, y:e.clientY };
  boostPtr = true;
});
cv.addEventListener('pointermove', function(e){
  if(!swipe || e.pointerId !== swipe.id) return;
  const dx = e.clientX-swipe.x, dy = e.clientY-swipe.y;
  const m = Math.hypot(dx,dy);
  if(m < 22) return;
  touchDir = { x:dx/m, y:dy/m };
  boostPtr = false;
});
function endSwipe(e){ if(swipe && e.pointerId === swipe.id){ swipe = null; touchDir = null; boostPtr = false; } }
cv.addEventListener('pointerup', endSwipe);
cv.addEventListener('pointercancel', endSwipe);

const dpad = $('#dpad');
Array.prototype.forEach.call(dpad.querySelectorAll('.dbtn'), function(btn){

    btn.addEventListener('pointerdown', function(e){
      e.preventDefault(); Sound.init(); Sound.resume(); set(true);
      if(btn.setPointerCapture) btn.setPointerCapture(e.pointerId);

    ctx.fillStyle = 'rgba(255,220,120,' + (0.10 + 0.10*Math.sin(b.wob)).toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(b.x, b.y, 24, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

function drawParts(){
  for(const p of S.parts){
    const a = clamp(p.life/p.max,0,1);
    if(p.kind === 'smoke'){
      ctx.save();
      ctx.globalAlpha = a*0.34;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill();
      ctx.restore();
      continue;
    }
    if(p.kind === 'rider'){
      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(0,0,p.size,0,TAU); ctx.fill();
      ctx.fillStyle = p.color2;
      ctx.beginPath(); ctx.arc(0,-p.size*0.7,p.size*0.6,0,TAU); ctx.fill();
      ctx.restore();
      continue;
    }
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(p.x,p.y); ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size);
    ctx.restore();
  }
}

function drawRings(){
  for(const r of S.rings){
    const k = 1 - r.life/r.max;
    ctx.save();
    ctx.globalAlpha = (1-k)*0.7;
    ctx.strokeStyle = 'rgba(' + r.rgb + ',1)';
    ctx.lineWidth = 4*(1-k) + 1;
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r0 + (r.r1-r.r0)*k, 0, TAU);
    ctx.stroke();
    ctx.restore();
  }
}

function drawTexts(){
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for(const t of S.texts){
    const a = clamp(t.life/t.max,0,1);
    ctx.globalAlpha = a;
    ctx.font = '800 21px "Segoe UI",system-ui,sans-serif';
    ctx.fillStyle = 'rgba(0,0,0,.62)';
    ctx.fillText(t.text, t.x+1.5, t.y+2);
    ctx.fillStyle = t.color;
    ctx.fillText(t.text, t.x, t.y);
    if(t.sub){
      ctx.font = '700 14px "Segoe UI",system-ui,sans-serif';
      ctx.fillStyle = 'rgba(0,0,0,.6)';
      ctx.fillText(t.sub, t.x+1, t.y+21);
      ctx.fillStyle = t.color;
      ctx.fillText(t.sub, t.x, t.y+20);
    }
  }
  ctx.restore();
}

function draw(){
  drawGround();
  ctx.save();
  if(S.shake > 0){
    const s = S.shake*12;
    ctx.translate(rnd(-s,s), rnd(-s,s));
  }
  drawMarks();
  drawSpeedLines();
  for(const b of S.bikes) drawBike(b);
  drawFlashes();
  for(let i=S.body.length-1;i>=0;i--) drawTrailer(S.body[i].x, S.body[i].y, S.body[i].a, i);
  drawCab(S.head.x, S.head.y, S.head.angle);
  drawRings();
  drawParts();
  drawTexts();
  ctx.restore();
  drawWalls();
  if(S.flash > 0){
    ctx.save();
    ctx.globalAlpha = S.flash*0.45;
    ctx.fillStyle = S.flashColor;
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }
}
function update(dt){
  S.t += dt;
  S.shake = Math.max(0, S.shake - dt*2.4);
  S.flash = Math.max(0, S.flash - dt*2.0);
  if(S.comboT > 0){
    S.comboT -= dt;
    if(S.comboT <= 0){ S.comboT = 0; S.combo = 0; }
  }
  if(S.mode === 'play'){
    const want = boostInput();
    const was = S.boosting;
    S.boosting = want && S.nitro > 0.02;
    if(S.boosting && !was) Sound.boostOn();
    if(!S.boosting && was) Sound.boostOff();
    if(S.boosting){
      S.nitro = Math.max(0, S.nitro - BOOST_DRAIN*dt);
      S.boostTick -= dt;
      if(S.boostTick <= 0){ S.boostTick = 0.12; Sound.boostTick(); }
    } else S.boostTick = 0;
  } else S.boosting = false;

  const frozen = S.hitStop > 0;
  if(frozen) S.hitStop -= dt;
  if(!frozen && S.mode === 'play') stepHead(dt);
  if(!frozen && S.mode === 'menu') stepMenu(dt);
  if(S.mode === 'play' || S.mode === 'menu'){
    S.body = computeBody();
    if(S.mode === 'play') collide();
  }
  if(S.mode === 'over' && S.overT > 0){
    S.overT -= dt;
    if(Math.random() < 0.5){
      S.parts.push({ kind:'smoke', x:S.head.x + rnd(-14,14), y:S.head.y + rnd(-14,14),
        vx:rnd(-20,20), vy:rnd(-30,-6), life:1.1, max:1.1, size:rnd(5,9),
        color:'#6b7280', rot:0, vr:0 });
    }
  }
  updateBikes(dt);
  updateEffects(dt);
  updateMeters();
}

let last = 0;
function loop(ts){
  const dt = Math.min(0.05, Math.max(0, (ts-last)/1000));
  last = ts;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

const veil = $('#veil');
const hudScore = $('#hudScore'), hudCars = $('#hudCars'), hudBest = $('#hudBest');
const comboBar = $('#comboBar'), comboTxt = $('#comboTxt'), comboWrap = $('#comboWrap');
const nitroBar = $('#nitroBar'), nitroWrap = $('#nitroWrap');

function syncHUD(){
  hudScore.textContent = S.score;
  hudCars.textContent = S.trailers;
  hudBest.textContent = S.best;
}
function updateMeters(){
  comboBar.style.width = (S.comboT > 0 ? (S.comboT/COMBO_TIME*100) : 0) + '%';
  comboTxt.textContent = S.combo > 1 ? ('连击 x' + Math.min(COMBO_MAX, S.combo)) : '连击';
  comboWrap.classList.toggle('on', S.combo > 1);
  nitroBar.style.width = (S.nitro*100) + '%';
  nitroWrap.classList.toggle('full', S.nitro > 0.92);
}
function showVeil(html){ veil.innerHTML = html; veil.classList.add('show'); }
function hideVeil(){ veil.classList.remove('show'); veil.innerHTML = ''; }

function showMenu(){
  setupMenu();
  showVeil(
    '<div class="card">' +
      '<div class="badge">TRUCK SNAKE</div>' +
      '<h1>货车贪吃蛇</h1>' +
      '<p class="sub">你是一辆长头卡车。车头撞、车厢蹭，摩托车碰着你的车队就报废——' +
      '每撞毁一辆就多挂一节车厢。连续撞车会叠加连击倍率，撞得越多氮气充得越快。</p>' +
      '<div class="legend">' +
        '<span class="lg"><i class="dot red"></i>车头</span><span class="arrow">+</span>' +
        '<span class="lg"><i class="dot blue"></i>车厢</span><span class="arrow">×</span>' +
        '<span class="lg">🏍️ 摩托</span><span class="arrow">=</span>' +
        '<span class="lg"><b>+1 车厢</b></span>' +
        '<span class="lg">✨ 金摩托</span><span class="arrow">=</span>' +
        '<span class="lg"><b>+2 车厢</b></span>' +
      '</div>' +
      '<div class="keys">' +
        '<span class="key">↑</span><span class="key">↓</span><span class="key">←</span><span class="key">→</span>' +
        '<span>/</span><span class="key">WASD</span><span>转向</span>' +
        '<span class="key">Shift</span><span class="key">空格</span><span>按住冲刺</span>' +
        '<span class="key">P</span><span>暂停</span>' +
      '</div>' +
      '<button class="btn primary" data-act="start">开始跑车</button>' +
      '<div class="hint">卡车不能掉头；车越长转弯半径越大，冲刺时更难拐弯，胆大也要心细。</div>' +
    '</div>'
  );
}

function showGameOver(){
  const reason = S.reason === 'wall' ? '撞上了护栏' : (S.reason === 'bike' ? '被摩托车撞上了车厢' : '咬到了自己的车厢');
  const isBest = S.score >= S.best && S.score > 0;
  showVeil(
    '<div class="card">' +
      '<div class="badge">' + (isBest ? 'NEW RECORD' : '撞车现场') + '</div>' +
      '<h1>撞车了</h1>' +
      '<p class="sub">' + reason + '。下次把车头留出转弯空间，长车头转弯半径可不小。</p>' +
      '<div class="ostats">' +
        '<div class="ostat"><span>得分</span><b>' + S.score + '</b></div>' +
        '<div class="ostat amber"><span>车厢</span><b>' + S.trailers + '</b></div>' +
        '<div class="ostat"><span>最高连击</span><b>x' + Math.min(COMBO_MAX, Math.max(1, S.comboMax)) + '</b></div>' +
        '<div class="ostat"><span>撞毁摩托</span><b>' + S.kills + '</b></div>' +
      '</div>' +
      '<div class="row"><button class="btn primary" data-act="start">再来一局</button></div>' +
      '<div class="hint">小技巧：车尾扫摩托同样算数，把长车厢甩进车流最划算。</div>' +
    '</div>'
  );
}

function showPause(){
  showVeil(
    '<div class="card">' +
      '<div class="badge">PAUSED</div>' +
      '<h1>已暂停</h1>' +
      '<p class="sub">当前 ' + S.score + ' 分 · ' + S.trailers + ' 节车厢 · 最高连击 x' +
        Math.min(COMBO_MAX, Math.max(1, S.comboMax)) + '</p>' +
      '<div class="row">' +
        '<button class="btn primary" data-act="resume">继续</button>' +
        '<button class="btn ghost" data-act="start">重新开始</button>' +
      '</div>' +
    '</div>'
  );
}

function startGame(){
  resetGame();
  hideVeil();
  Sound.init(); Sound.resume(); Sound.go();
  updatePauseBtn();
}

function togglePause(){
  if(S.mode === 'play'){ S.mode = 'pause'; S.boosting = false; boostKey = false; boostBtn = false; boostPtr = false; showPause(); }
  else if(S.mode === 'pause'){ S.mode = 'play'; hideVeil(); }
  updatePauseBtn();
}

function updatePauseBtn(){
  $('#btnPause').textContent = (S.mode === 'pause') ? '▶' : '⏸';
}

veil.addEventListener('click', function(e){
  const btn = e.target.closest('[data-act]');
  if(!btn) return;
  const act = btn.getAttribute('data-act');
  if(act === 'start') startGame();
  else if(act === 'resume') togglePause();
});
$('#btnPause').addEventListener('click', togglePause);
$('#btnRestart').addEventListener('click', startGame);
$('#btnSound').addEventListener('click', function(){
  Sound.init();
  Sound.on = !Sound.on;
  this.textContent = Sound.on ? '🔊' : '🔇';
});
document.addEventListener('visibilitychange', function(){
  if(document.hidden && S.mode === 'play') togglePause();
});

if(navigator.maxTouchPoints > 0 || window.matchMedia('(hover:none)').matches) document.body.classList.add('touch');
syncHUD();
updateMeters();
showMenu();
requestAnimationFrame(loop);
})();

</script>
</body>
